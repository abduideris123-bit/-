<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans Ethiopic','Segoe UI',sans-serif;background:#F0FDF4;color:#1C2B1A;min-height:100vh;padding-bottom:84px;}
input,select,button{font-family:inherit;}
.hdr{background:linear-gradient(135deg,#16A34A,#15803D);padding:12px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px #00000022;}
.hdr-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.hdr h1{font-size:18px;font-weight:800;color:#fff;}
.hdr .sub{font-size:11px;color:#BBF7D0;margin-top:1px;}
.out-btn{background:#ffffff22;border:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;}
.main{max-width:560px;margin:0 auto;padding:14px;}
.card{background:#fff;border-radius:16px;padding:16px;border:1px solid #BBF7D0;box-shadow:0 2px 8px #00000008;margin-bottom:12px;}
.card.warn{background:#FEF2F2;border-color:#EF444433;}
.card.gold{background:#FEF9C3;border-color:#CA8A0433;}
.card.grn{background:#DCFCE7;border-color:#16A34A33;}
.card.exp{background:#FFF1F2;border-color:#FB7185;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.sv{font-size:17px;font-weight:800;}
.sv.g{color:#16A34A;}.sv.go{color:#CA8A04;}.sv.a{color:#15803D;}.sv.r{color:#EF4444;}
.sl{font-size:11px;color:#6B7280;margin-top:2px;}
.st{font-size:13px;font-weight:700;color:#15803D;margin-bottom:10px;}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #BBF7D0;font-size:13px;}
.row:last-child{border-bottom:none;}
.rn{font-weight:600;}.rs{font-size:11px;color:#6B7280;margin-top:1px;}.rv{font-size:14px;font-weight:800;color:#16A34A;}
.wr{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #EF444411;}
.wv{font-weight:700;color:#EF4444;}
.inp{width:100%;border:1.5px solid #BBF7D0;border-radius:10px;padding:9px 12px;font-size:14px;color:#1C2B1A;outline:none;background:#fff;margin-bottom:9px;}
.inp:focus{border-color:#16A34A;}
.lbl{font-size:11px;font-weight:600;color:#6B7280;margin-bottom:3px;}
.btn{padding:9px 16px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;}
.btn.p{background:#16A34A;color:#fff;}
.btn.d{background:#EF4444;color:#fff;}
.btn.g{background:#F3F4F6;color:#374151;}
.btn.full{width:100%;padding:13px;font-size:15px;}
.fr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
.cat-card{background:#fff;border-radius:16px;padding:16px 12px;border:2px solid #BBF7D0;cursor:pointer;text-align:center;transition:all 0.15s;box-shadow:0 2px 8px #00000008;}
.cat-card:active{transform:scale(0.96);}
.cat-icon{font-size:30px;margin-bottom:5px;}
.cat-name{font-size:13px;font-weight:700;}
.cat-count{font-size:11px;color:#6B7280;margin-top:2px;}
.back-btn{display:flex;align-items:center;gap:6px;background:transparent;border:none;color:#16A34A;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;padding:0;}
.pi{background:#fff;border-radius:14px;padding:12px;border:1px solid #BBF7D0;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.pi.exp-soon{border-color:#FB7185;background:#FFF1F2;}
.pi.expired{border-color:#EF4444;background:#FEE2E2;}
.pic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.pinfo{flex:1;min-width:0;}
.pname{font-weight:700;font-size:14px;}
.pcat{font-size:11px;color:#6B7280;margin-top:1px;}
.pqty{font-size:11px;margin-top:2px;}
.pqty .q{font-weight:700;color:#16A34A;}.pqty .q.low{color:#EF4444;}
.pexp{font-size:10px;margin-top:2px;font-weight:600;}
.pexp.ok{color:#16A34A;}.pexp.soon{color:#F59E0B;}.pexp.expired{color:#EF4444;}
.pact{display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
.ib{border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:13px;}
.ib.e{background:#F3F4F6;}.ib.dl{background:#FEF2F2;}
.si{background:#fff;border-radius:14px;padding:12px;border:1px solid #BBF7D0;margin-bottom:8px;}
.sh{display:flex;justify-content:space-between;align-items:flex-start;}
.sn{font-weight:700;font-size:14px;}.sm{font-size:11px;color:#6B7280;margin-top:2px;}
.st2{font-size:15px;font-weight:800;color:#16A34A;}.sp{font-size:10px;color:#15803D;}
.sact{display:flex;gap:5px;margin-top:8px;border-top:1px solid #BBF7D0;padding-top:8px;}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #BBF7D0;padding:5px 12px 10px;box-shadow:0 -4px 20px #00000010;}
.bnav-in{max-width:560px;margin:0 auto;display:flex;gap:4px;}
.nb{flex:1;padding:7px 2px;border:none;border-radius:11px;background:transparent;color:#6B7280;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nb.active{background:#16A34A;color:#fff;}
.ni{font-size:18px;}
.mbg{position:fixed;inset:0;background:#00000066;z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.mod{background:#fff;border-radius:20px 20px 0 0;padding:22px 18px 30px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
.mt{font-size:16px;font-weight:800;margin-bottom:16px;}
.ma{display:flex;gap:10px;margin-top:8px;}
.cmod-bg{position:fixed;inset:0;background:#00000066;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.cmod{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:340px;text-align:center;}
.cmod .bi{font-size:38px;margin-bottom:10px;}
.cmod h3{font-size:15px;font-weight:700;margin-bottom:7px;}
.cmod p{font-size:12px;color:#6B7280;margin-bottom:18px;}
.ca{display:flex;gap:10px;}
.tp{background:#DCFCE7;border:1px solid #BBF7D0;border-radius:10px;padding:9px 13px;margin-bottom:12px;font-size:13px;}
.tp strong{color:#16A34A;}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#1C2B1A;color:#fff;border-radius:12px;padding:9px 18px;font-size:13px;font-weight:600;z-index:300;white-space:nowrap;box-shadow:0 4px 20px #00000044;}
.empty{color:#9CA3AF;font-size:13px;text-align:center;padding:28px;}
/* exp alert banner */
.exp-banner{background:#FFF1F2;border:1.5px solid #FB7185;border-radius:14px;padding:12px 14px;margin-bottom:12px;}
.exp-banner .etitle{font-size:13px;font-weight:700;color:#EF4444;margin-bottom:8px;}
.exp-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #FEE2E2;}
.exp-row:last-child{border-bottom:none;}
.lbg{min-height:100vh;background:linear-gradient(160deg,#16A34A,#15803D 60%,#052e16);display:flex;align-items:center;justify-content:center;padding:20px;}
.lcard{background:#fff;border-radius:22px;padding:34px 26px;width:100%;max-width:360px;box-shadow:0 20px 60px #00000044;}
.llogo{text-align:center;margin-bottom:24px;}
.llogo .em{font-size:50px;margin-bottom:6px;}
.llogo h2{font-size:22px;font-weight:800;color:#15803D;}
.llogo p{font-size:12px;color:#6B7280;margin-top:3px;}
.ibox{background:#DCFCE7;border:1px solid #BBF7D0;border-radius:11px;padding:9px 13px;font-size:12px;color:#15803D;margin-bottom:16px;line-height:1.6;}
.err{color:#EF4444;font-size:12px;margin-top:-6px;margin-bottom:7px;}
.rr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #BBF7D0;font-size:13px;}
.rr span:first-child{color:#6B7280;}.rr span:last-child{font-weight:700;}
select.inp{appearance:auto;}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;}
.badge.exp{background:#FEE2E2;color:#EF4444;}
.badge.soon{background:#FEF9C3;color:#CA8A04;}
.sync-bar{display:flex;align-items:center;gap:6px;font-size:11px;color:#BBF7D0;margin-top:2px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0;}
.sync-dot.syncing{background:#fbbf24;animation:pulse 1s infinite;}
.sync-dot.error{background:#f87171;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.icon-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.icon-opt{width:38px;height:38px;border-radius:8px;border:1.5px solid #BBF7D0;background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-opt.sel{border-color:#16A34A;background:#DCFCE7;}
.color-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.color-opt{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.color-opt.sel{border-color:#1C2B1A;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #BBF7D0;font-size:13px;}
.detail-row:last-child{border-bottom:none;}
.detail-label{color:#6B7280;font-size:12px;}
.detail-val{font-weight:700;font-size:13px;}
.desc-box{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:10px 12px;font-size:13px;color:#1C2B1A;line-height:1.7;margin-top:4px;}
/* Product grid cards */
.prod-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:4px;}
.pg-card{background:#fff;border-radius:14px;padding:12px 10px;border:1px solid #BBF7D0;box-shadow:0 2px 8px #00000008;cursor:pointer;position:relative;transition:all 0.15s;}
.pg-card:active{transform:scale(0.97);}
.pg-card.exp-soon{border-color:#FB7185;}
.pg-card.expired{border-color:#EF4444;background:#FEF2F2;}
.pg-badge{display:inline-block;background:#16A34A;color:#fff;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;margin-bottom:6px;}
.pg-name{font-size:12px;font-weight:700;color:#1C2B1A;margin-bottom:6px;line-height:1.3;min-height:32px;}
.pg-price{font-size:14px;font-weight:800;color:#16A34A;margin-bottom:4px;}
.pg-unit{font-size:10px;color:#6B7280;}

function tgWhy(j,st){
  var d=(j&&j.description)||'';

}
async function tgSaveBackup(user, data){
  if(!user||!TG_TOKEN||!TG_CHAT) return false; // no backup without login / Telegram ቅንብር
  try{
    var json=JSON.stringify(Object.assign({},data,{moves:S.moves,counts:S.counts}));
    var blob=new Blob([json],{type:'application/json'});
    var fname='grb_backup_'+user.replace(/[^a-z0-9]/gi,'_')+'_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.json';
    var form=new FormData();
    form.append('chat_id', TG_CHAT);
    form.append('document', blob, fname);
    form.append('caption', '🌱 ግብርና ሱቅ backup\n📅 '+new Date().toLocaleString()+'\n👤 '+user);
    var r=await fetch(tgApi()+'/sendDocument', {method:'POST', body:form});
    var j=await r.json();
    S.tgLastErr=j.ok?'':tgWhy(j,r.status);
    return !!j.ok;
  } catch(e){ console.log('TG save error',e); S.tgLastErr='api.telegram.org መድረስ አልተቻለም — ኢንተርኔት/VPN ያረጋግጡ'; return false; }

async function tgLoadLatest(){
  if(!TG_TOKEN) return null;
  try{
    // get latest file from bot
    var resp=await fetch(tgApi()+'/getUpdates?limit=50&offset=-50');
    var json=await resp.json();
    if(!json.ok||!json.result) return null;
    // find latest document message
    var msgs=json.result.filter(u=>u.message&&u.message.document&&u.message.document.file_name&&u.message.document.file_name.startsWith('grb_backup_'));
    if(msgs.length===0) return null;
    // get latest
    var latest=msgs[msgs.length-1];
    var fileId=latest.message.document.file_id;
    // get file path
    var fr=await fetch(tgApi()+'/getFile?file_id='+fileId);
    var fj=await fr.json();
    if(!fj.ok) return null;
    var filePath=fj.result.file_path;
    // download file
    var dr=await fetch('https://api.telegram.org/file/bot'+TG_TOKEN+'/'+filePath);
    var text=await dr.text();
    return JSON.parse(text);
  } catch(e){ console.log('TG load error',e); return null; }
}

function importFromFile(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.products||!Array.isArray(data.products)){
        showToast('❌ ፋይሉ ትክክለኛ backup አይደለም');return;
      }
      var ps=data.products||[];
      var ss=data.sales||[];
      var tr=data.trash||[];
      var cats=data.cats||[...DEFAULT_CATS];
      CATS=cats;
      saveCats(S.user,CATS);
      saveData(S.user,ps,ss,tr,cats);
      var mv=Array.isArray(data.moves)?data.moves:S.moves;
      var cn=Array.isArray(data.counts)?data.counts:S.counts;
      saveMoves(S.user,mv);saveCounts(S.user,cn);
      set({products:ps,sales:ss,trash:tr,cats:cats,moves:mv,counts:cn});
      showToast('✅ '+ps.length+' ዕቃ · '+ss.length+' ሽያጭ ተጫነ!');
    }catch(err){
      showToast('❌ ፋይሉን ማንበብ አልተቻለም');
    }
  };
  reader.readAsText(file);
}

function compressImage(file,maxW,maxH,quality,cb){
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>maxW||h>maxH){
        var ratio=Math.min(maxW/w,maxH/h);
        w=Math.round(w*ratio);h=Math.round(h*ratio);
      }
      var canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=function(){showToast('⚠️ ፎቶ መጫን አልተቻለም');};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function splitBigText(p,max){
  var out=[];
  while(p.length>max){
    var cut=p.lastIndexOf('።',max);
    if(cut<max*0.4) cut=p.lastIndexOf('. ',max);
    if(cut<max*0.4) cut=max;
    out.push(p.slice(0,cut+1));
    p=p.slice(cut+1);
  }
  if(p.trim()) out.push(p);
  return out;
}
function refBooksPrompt(maxChars,query){
  maxChars=maxChars||9000;
  var books=S.refBooks||[];
  if(!books.length) return '';
  var words=(query||'').toLowerCase().split(/[\s,.;:!?፣።፤፥፦()\-\/"']+/).filter(function(w){return w.length>=3;});
  var chunks=[];
  books.forEach(function(b,bi){
    var title=b.title||('መጽሐፍ '+(bi+1)), cur='';
    (b.text||'').split(/\n+/).forEach(function(par){
      splitBigText(par,1000).forEach(function(piece){
        if(cur&&cur.length+piece.length>900){chunks.push({title:title,bi:bi,k:chunks.length,x:cur});cur='';}
        cur+=(cur?'\n':'')+piece;
      });
    });
    if(cur) chunks.push({title:title,bi:bi,k:chunks.length,x:cur});
  });
  chunks.forEach(function(c){
    var low=c.x.toLowerCase();
    c.score=words.reduce(function(a,w){
      if(low.indexOf(w)>=0) return a+2;
      if(w.length>=5&&low.indexOf(w.slice(0,4))>=0) return a+1;
      return a;
    },0);
  });
  var picked=chunks.filter(function(c){return c.score>0;}).sort(function(a,b){return b.score-a.score||a.k-b.k;});
  var used=0,sel=[];
  if(picked.length){
    for(var n=0;n<picked.length&&used<maxChars;n++){sel.push(picked[n]);used+=picked[n].x.length;}
  } else {
    for(var m=0;m<chunks.length&&used<Math.min(maxChars,6000);m++){sel.push(chunks[m]);used+=chunks[m].x.length;}
  }
  sel.sort(function(a,b){return a.k-b.k;});
  var out='',lastTitle='';
  sel.forEach(function(c){
    if(c.title!==lastTitle){out+='\n\n### '+c.title+'\n';lastTitle=c.title;} else out+='\n…\n';
    out+=c.x;
  });
  return out;
}
function findInRefBooks(query){
  var q=(query||'').toLowerCase();
  var words=q.split(/\s+/).filter(function(w){return w.length>2;});
  var hits=[];
  (S.refBooks||[]).forEach(function(b){
    var text=b.text||'',lower=text.toLowerCase();
    for(var i=0;i<words.length;i++){
      var idx=lower.indexOf(words[i]);
      if(idx>-1){
        var start=Math.max(0,idx-80),end=Math.min(text.length,idx+180);
        hits.push({title:b.title,snippet:(start>0?'…':'')+text.slice(start,end).trim()+(end<text.length?'…':'')});
        break;
      }
    }
  });
  return hits.slice(0,2);
}

function matchPlantProblem(query){
  var q=(query||'').toLowerCase();
  var all=PLANT_KB.concat(ANIMAL_KB);
  var scored=all.map(function(e){
    var score=e.kw.reduce(function(s,k){return s+(q.indexOf(k.toLowerCase())>-1?1:0);},0);
    return {entry:e,score:score};
  }).filter(function(x){return x.score>0;}).sort(function(a,b){return b.score-a.score;});
  return scored.slice(0,2).map(function(x){return x.entry;});
}
async function geminiGenerate(sys,parts,maxTok){

  for(var i=0;i<chain.length;i++){

      clearTimeout(tm);

    }

    if(resp.ok&&cand){
      var text=((cand.content&&cand.content.parts)||[]).filter(function(x){return !x.thought;}).map(function(x){return x.text||'';}).join('\n').trim();
      if(text){
        try{localStorage.setItem('grb_ai_model',c.m);}catch(e){}

function askAIOffline(q){
  var matches=matchPlantProblem(q);
  var bookHits=findInRefBooks(q);
  var text='';
  if(matches.length===0 && bookHits.length===0){
    text='🔍 የገለጹትን ምልክት በትክክል ማወቅ አልቻልኩም። እባክዎ ትንሽ ተጨማሪ ዝርዝር ይስጡ (ለምሳሌ፡ የትኛው ክፍል ላይ ነው፣ ቀለም ለውጥ አለ ወይ) ወይም ከአካባቢዎ የግብርና ባለሙያ ጋር ያማክሩ።\n\nበአሁኑ ጊዜ ያለዎት ክምችት፦\n'+
      (S.products||[]).filter(function(p){return p.quantity>0;}).slice(0,10).map(function(p){return '• '+p.name;}).join('\n');
  } else {
    if(bookHits.length>0){
      text+=bookHits.map(function(h){return '📚 ከ"'+h.title+'" መጽሐፍ፦\n'+h.snippet;}).join('\n\n')+'\n\n';
    }
    matches.forEach(function(m,i){
      text+=(i===0?'🌿 ':'\n\n🌿 ')+'ሊሆን የሚችል ችግር፦ '+m.name+'\n'+m.tip+'\n';
      var avail=(S.products||[]).filter(function(p){return p.quantity>0 && m.cats.indexOf(p.category)>-1;});
      if(avail.length>0){
        text+='\n✅ ከክምችትዎ ውስጥ ተስማሚ የሆኑ ዕቃዎች፦\n'+avail.map(function(p){return '• '+p.name+' ('+p.quantity+' '+(p.unit||'')+' ይገኛል)';}).join('\n');
      } else {
        var catNames=m.cats.map(function(cid){return (getCats().find(function(c){return c.id===cid;})||{}).name||cid;}).join(' ወይም ');
        text+='\n⚠️ ከክምችትዎ ውስጥ ተስማሚ ዕቃ አልተገኘም። እባክዎ የ"'+catNames+'" አይነት ዕቃ ያምጡ።';
      }
      var usageNote=m.cats.map(function(cid){return CATEGORY_USAGE[cid];}).filter(Boolean)[0];
      if(usageNote) text+='\n'+usageNote;
    });
  }
  var hist=[{id:uid(),query:q,result:text,date:today()}].concat(S.aiHistory||[]).slice(0,15);
  saveAIHistory(S.user,hist);
  set({aiResult:text,aiHistory:hist});
}
function speakAIResult(){
  if(!('speechSynthesis' in window)){showToast('⚠️ ይህ መሳሪያ ድምጽ ማንበብን አይደግፍም');return;}
  if(S.aiSpeaking){
    window.speechSynthesis.cancel();
    set({aiSpeaking:false});
    return;
  }
  if(!S.aiResult) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(S.aiResult);
  u.lang='am-ET';
  u.rate=0.95;
  var voices=window.speechSynthesis.getVoices();
  var amVoice=voices.find(function(v){return v.lang&&v.lang.toLowerCase().indexOf('am')===0;});
  if(amVoice) u.voice=amVoice;
  u.onend=function(){set({aiSpeaking:false});};
  u.onerror=function(){set({aiSpeaking:false});};
  window.speechSynthesis.speak(u);
  set({aiSpeaking:true});
}

// Exp date helpers
const EXP_WARN_DAYS=90; // ማስጠንቀቂያ የሚጀምርበት ቀን (3 ወር). ለመቀየር ይህን ቁጥር ቀይር
function expLeft(n){return n>30?Math.floor(n/30)+' ወር '+(n%30?(n%30)+' ቀን ':'')+'ይቀረዋል':n+' ቀን ይቀረዋል';}
function expStatus(expDate){
  if(!expDate) return null;
  const now=new Date(); const exp=new Date(expDate);
  const diffDays=Math.ceil((exp-now)/(1000*60*60*24));
  if(diffDays<0) return {status:'expired',label:'ጊዜ አልፎበታል!',days:diffDays};
  if(diffDays<=EXP_WARN_DAYS) return {status:'soon',label:expLeft(diffDays),days:diffDays};
  return {status:'ok',label:expLeft(diffDays),days:diffDays};
}

async function login(){
  const v=S.loginVal.trim();
  if(!v){set({loginErr:'ስልክ ቁጥር ወይም Email አስገቡ'});return;}
  const ok=/^[0-9+]{7,15}$/.test(v.replace(/\s/g,''))||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  if(!ok){set({loginErr:'ትክክለኛ ስልክ ቁጥር ወይም Email አስገቡ'});return;}
  const d=loadData(v);
  var loadedCats=loadCats(v)||(d&&d.cats?d.cats:[...DEFAULT_CATS]);
  CATS=loadedCats;
  var loadedExp=loadExpenses(v);
  var loadedAI=loadAIHistory(v);
  var loadedRefBooks=loadRefBooks(v);
  set({user:v,products:d?d.products:DEMO.products,sales:d?d.sales:DEMO.sales,trash:d?d.trash||[]:[],cats:loadedCats,expenses:loadedExp,aiHistory:loadedAI,refBooks:loadedRefBooks,moves:loadMoves(v),counts:loadCounts(v)});
  checkExpNotifications(d?d.products:DEMO.products);
}

function sendNotif(title, body, tag){
  if(!('Notification' in window)) return;
  function show(){
    var opt={body:body,tag:tag||undefined};
    function fallback(){try{new Notification(title,opt);}catch(e){}}
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
        navigator.serviceWorker.getRegistration().then(function(reg){
          if(reg&&reg.showNotification) reg.showNotification(title,opt); else fallback();
        }).catch(fallback);
      } else fallback();
    }catch(e){fallback();}
  }
  if(Notification.permission==='granted') show();
  else if(Notification.permission!=='denied'){
    Notification.requestPermission().then(function(perm){if(perm==='granted') show();});
  }
}

function checkExpNotifications(prods){
  var thresh=S.lowThreshold||10;
  // expiry alerts
  var expiring=prods.filter(function(p){var s=expStatus(p.expDate);return s&&(s.status==='expired'||s.status==='soon');});
  expiring.sort(function(a,b){return expStatus(a.expDate).days-expStatus(b.expDate).days;});
  expiring.slice(0,3).forEach(function(p){
    var s=expStatus(p.expDate);
    sendNotif('🌱 ግብርና ሱቅ — '+p.name, s.label);
  });
  if(expiring.length>3){ // 3 ወር ማስጠንቀቂያ ብዙ ስለሆነ የቀሩትን በአንድ ማሳወቂያ
    sendNotif('⏰ ጊዜ እያለቀ — ተጨማሪ '+(expiring.length-3)+' ዕቃ', 'በ'+Math.round(EXP_WARN_DAYS/30)+' ወር ውስጥ ጊዜያቸው ያልቃል፤ ዝርዝሩን በዋናው ገጽ ይመልከቱ');
  }
  // low stock alerts
  var low=prods.filter(function(p){return p.quantity<=thresh;});
  if(low.length>0){
    var names=low.slice(0,3).map(function(p){return p.name+'('+p.quantity+')';}).join(', ');
    if(low.length>3) names+=(' +'+( low.length-3)+' ዕቃ');
    sendNotif('⚠️ ዝቅተኛ ክምችት — '+low.length+' ዕቃ', names);
  }
}

function checkLowStock(){
  var thresh=S.lowThreshold||10;
  var low=S.products.filter(function(p){return p.quantity<=thresh;});
  if(low.length>0){
    if(Notification.permission==='granted'){
      var names=low.slice(0,3).map(function(p){return p.name+': '+p.quantity+' '+p.unit;}).join('\n');
      if(low.length>3) names+='\n+'+(low.length-3)+' ተጨማሪ';
      sendNotif('⚠️ ዝቅተኛ ክምችት ('+low.length+' ዕቃ)', names);
    } else {
      Notification.requestPermission().then(function(perm){
        if(perm==='granted') checkLowStock();
      });
    }
    set({showLowAlert:true});
  } else {
    showToast('✅ ሁሉም ዕቃ ተቀናጅቷል — ዝቅተኛ ክምችት የለም');
  }
}

function saveProd(){
  const f=S.pF;
  if(!f.name||f.quantity===''||f.quantity===null||f.quantity===undefined||!f.sellPrice){showToast('⚠️ ስም፣ ብዛት፣ ዋጋ ያስፈልጋል');return;}
  let ps,newId=null;
  if(S.editP) ps=S.products.map(p=>p.id===S.editP.id?{...p,...f,quantity:+f.quantity,buyPrice:+f.buyPrice,sellPrice:+f.sellPrice,desc:f.desc||''}:p);
  else {newId=uid();ps=[...S.products,{id:newId,...f,quantity:+f.quantity,buyPrice:+f.buyPrice,sellPrice:+f.sellPrice,desc:f.desc||''}];}
  saveData(S.user,ps,S.sales,S.trash,S.cats);
  if(newId&&S.tab==='count'){S.countF[newId]=String(+f.quantity);S.cSearch='';}
  set({products:ps,showPForm:false,editP:null});
  showToast('✅ ዕቃ ተቀምጧል');
}
function delProd(id){
  const p=S.products.find(x=>x.id===id);
  if(!p) return;
  const ps=S.products.filter(x=>x.id!==id);
  const tr=[...S.trash,{...p,deletedAt:today(),type:'product'}];
  saveData(S.user,ps,S.sales,tr,S.cats);
  set({products:ps,trash:tr,confDel:null,detailP:null});
  showToast('🗑️ ወደ ታሪክ ተወሰደ');
}
function restoreProd(id){
  const item=S.trash.find(x=>x.id===id);
  if(!item) return;
  const tr=S.trash.filter(x=>x.id!==id);
  if(item.type==='sale'){
    const {deletedAt,type,...s}=item;
    const ss=[...S.sales,s];
    const ps=S.products.map(p=>p.id===s.productId?{...p,quantity:p.quantity-s.qty}:p);
    saveData(S.user,ps,ss,tr,S.cats);
    set({sales:ss,products:ps,trash:tr});
  } else {
    const {deletedAt,type,...prod}=item;
    const ps=[...S.products,prod];
    saveData(S.user,ps,S.sales,tr,S.cats);
    set({products:ps,trash:tr});
  }
  showToast('✅ ተመልሷል!');
}

function moveCat(idx,dir){
  var cats=getCats().slice();
  var newIdx=idx+dir;
  if(newIdx<0||newIdx>=cats.length) return;
  var tmp=cats[idx];cats[idx]=cats[newIdx];cats[newIdx]=tmp;
  CATS=cats;
  saveCats(S.user,CATS);
  saveData(S.user,S.products,S.sales,S.trash,cats);
  set({cats:cats});
}

  const usedPrice=(f.price!==''&&f.price!=null&&!isNaN(+f.price))?+f.price:prod.sellPrice;
  let ss,ps;
  if(S.editS){
    // editing existing sale — restore old qty first
    const old=S.sales.find(s=>s.id===S.editS);
    const oldProd=S.products.find(p=>p.id===old.productId);
    // restore old qty
    ps=S.products.map(p=>{
      if(p.id===old.productId) return {...p,quantity:p.quantity+old.qty};
      return p;
    });
    // check new qty
    const newProd=ps.find(p=>p.id===f.productId);
    if(+f.qty>newProd.quantity){showToast('⚠️ ያለው ክምችት: '+newProd.quantity+' '+newProd.unit);return;}
    const total=+f.qty*usedPrice;
    ss=S.sales.map(s=>s.id===S.editS?{...s,productId:newProd.id,productName:newProd.name,qty:+f.qty,price:usedPrice,total,date:f.date}:s);
    ps=ps.map(p=>p.id===f.productId?{...p,quantity:p.quantity-+f.qty}:p);
  } else {
    if(+f.qty>prod.quantity){showToast('⚠️ ያለው ክምችት: '+prod.quantity+' '+prod.unit);return;}
    const total=+f.qty*usedPrice;
    ss=[...S.sales,{id:uid(),productId:prod.id,productName:prod.name,qty:+f.qty,price:usedPrice,total,date:f.date}];
    ps=S.products.map(p=>p.id===prod.id?{...p,quantity:p.quantity-+f.qty}:p);
  }
  saveData(S.user,ps,ss,S.trash,S.cats);
  set({sales:ss,products:ps,showSForm:false,editS:null,sF:{productId:'',qty:'',date:today(),price:'',saleCat:''}});
  showToast('✅ ሽያጭ ተቀምጧል');
}
function delSale(id){

  if(!s) return;
  // restore qty
  const ps=S.products.map(p=>p.id===s.productId?{...p,quantity:p.quantity+s.qty}:p);
  const ss=S.sales.filter(x=>x.id!==id);
  const tr=[...S.trash,{...s,deletedAt:today(),type:'sale'}];

// ሁለት ስሪቶችን ያዋህዳል (A = የዚህ ስልክ፣ B = የ Gist)

  [A,B].forEach(function(X){(X.products||[]).forEach(emit);(X.sales||[]).forEach(emit);(X.trash||[]).forEach(emit);(X.expenses||[]).forEach(emit);});

  out.products=out.products.map(function(p){
    var a=(A.products||[]).find(function(x){return x.id===p.id;}),b=(B.products||[]).find(function(x){return x.id===p.id;});
    if(!a||!b||a.quantity===b.quantity) return p;

  });

    if(!hasRemote||ghCanon(M)!==ghCanon(remote)){
      var payload={v:1,at:new Date().toISOString(),by:S.user,products:M.products,sales:M.sales,trash:M.trash,expenses:M.expenses,moves:M.moves,counts:M.counts,cats:M.cats,catsU:M.catsU,tomb:M.tomb};

      if(!pr.ok) throw new Error('PATCH '+pr.status);
      _ghEtag='';_ghRemote=null; // ሌላ ስልክ በመሃል ከጻፈ በሚቀጥለው ጊዜ እንደገና እናነባለን
    }
    localStorage.setItem(joinKey,'1');_ghFails=0;
    ghStatus('🔄 ተመሳስሏል '+hhmm());
  }catch(e){
    _ghFails++;ghStatus('⚠️ ማመሳሰል አልተሳካም — በኋላ ይደገማል');

}

function quickCommit(){
  var q=S.quick; if(!q) return;
  var p=S.products.find(function(x){return x.id===q.id;});
  if(!p){set({quick:null});return;}
  var n=+q.qty;
  if(!(n>0)){showToast('⚠️ ብዛት ጻፍ');return;}
  var d=today(), ss=S.sales, type, ps, msg, sid=null, mid=uid();
  if(q.type==='in'){
    type='in';
    ps=S.products.map(function(x){return x.id===p.id?Object.assign({},x,{quantity:round3(x.quantity+n)}):x;});
    msg='✅ ገባ: '+n+' '+(p.unit||'')+' · '+p.name;
  } else {
    if(n>p.quantity){showToast('⚠️ ያለው ክምችት: '+p.quantity+' '+(p.unit||''));return;}
    ps=S.products.map(function(x){return x.id===p.id?Object.assign({},x,{quantity:round3(x.quantity-n)}):x;});
    if(q.reason==='sale'){
      type='out';
      var price=(q.price!==''&&q.price!=null&&!isNaN(+q.price))?+q.price:p.sellPrice;
      sid=uid();
      ss=S.sales.concat([{id:sid,productId:p.id,productName:p.name,qty:n,price:price,total:n*price,date:d}]);
      msg='✅ ሽያጭ: '+n+' '+(p.unit||'')+' · '+ETB(n*price);
    } else {
      type='waste';
      msg='✅ ብክነት ተመዝግቧል: '+n+' '+(p.unit||'')+' · '+p.name;
    }
  }
  var mv=S.moves.concat([{id:mid,pid:p.id,name:p.name,unit:p.unit||'',type:type,qty:n,date:d,ts:Date.now(),sid:sid}]).slice(-800);
  saveData(S.user,ps,ss,S.trash,S.cats);
  saveMoves(S.user,mv);
  set({products:ps,sales:ss,moves:mv,quick:null,undo:{mid:mid,sid:sid,pid:p.id,type:type,qty:n,label:(type==='in'?'ገባ':type==='out'?'ሽያጭ':'ብክነት')+' '+n+' '+(p.unit||'')+' · '+p.name}});
  setTimeout(function(){if(S.undo&&S.undo.mid===mid)set({undo:null});},120000);
  showToast(msg);
  scheduleTgBackup();
}

function cntDiffHtml(p,val){

function closeMinutes(){
  var t=(S.closeTime||'21:00').split(':');
  var m=(+t[0])*60+(+t[1]);
  if(isNaN(m)) m=21*60;
  if(m<240) m=1439; // 00:00–03:59 → የዚያ ቀን መጨረሻ
  return m;
}
function dailyCheck(){
  try{
    if(!S.user||!S.remindOn||!S.products.length) return;
    var now=new Date();
    if(now.getHours()*60+now.getMinutes()<closeMinutes()) return;
    var key='grb_remind_'+S.user;
    if(localStorage.getItem(key)===today()) return;

}

function todayReport(){
  var t=today(), thr=S.lowThreshold||10;
  var ss=S.sales.filter(function(x){return x.date===t;});
  var total=0,profit=0,byName={};
  ss.forEach(function(x){
    var pr=(x.price!=null?x.price:(x.qty?x.total/x.qty:0));
    total+=x.total||0;
    var p=S.products.find(function(y){return y.id===x.productId;});
    if(p) profit+=(pr-p.buyPrice)*x.qty;
    byName[x.productName]=(byName[x.productName]||0)+x.qty;
  });
  var top=Object.keys(byName).sort(function(a,b){return byName[b]-byName[a];}).slice(0,3).map(function(n){return n+' ('+round3(byName[n])+')';});
  var wasteVal=0,wasteN=0,inN=0;
  S.moves.forEach(function(m){
    if(m.date!==t) return;
    if(m.type==='waste'){wasteN++;var p=S.products.find(function(y){return y.id===m.pid;});if(p) wasteVal+=m.qty*p.buyPrice;}
    if(m.type==='in') inN++;
  });
  var low=S.products.filter(function(p){return p.quantity<=thr;}).length;
  return {date:t,n:ss.length,total:total,profit:profit,top:top,wasteN:wasteN,wasteVal:wasteVal,inN:inN,low:low};
}
function reportLines(r){
  var L=[];
  L.push('💰 ሽያጭ: '+ETB(Math.round(r.total))+' ('+r.n+' ግብይት)');
  if(!isStaff()) L.push('📈 ትርፍ: '+ETB(Math.round(r.profit)));
  if(r.top.length) L.push('🏆 ብዙ የተሸጠ: '+r.top.join('፣ '));
  if(r.inN) L.push('📥 ዕቃ የገባ: '+r.inN+' ጊዜ');
  if(r.wasteN) L.push('🗑️ ብክነት: '+r.wasteN+' ጊዜ'+(r.wasteVal>0&&!isStaff()?' ('+ETB(Math.round(r.wasteVal))+')':''));
  if(r.low) L.push('⚠️ ክምችት ያነሰ: '+r.low+' ዕቃ');
  return L;
}

function pgBack(title){
  return '<div class="fr"><button class="back-btn" id="pg-back">← ተመለስ</button><span style="font-weight:800;font-size:14px">'+title+'</span></div>';

function pad2(n){return (n<10?'0':'')+n;}
function fmtTime(ts){var d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function shiftDate(ds,delta){
  var p=ds.split('-');
  var d=new Date(+p[0],+p[1]-1,+p[2]+delta);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

// ── 🕒 የእንቅስቃሴ ዝርዝር ──────────────────────────────────────────────────
function logEntries(day){
  var used={},E=[];
  S.moves.forEach(function(m){
    if(m.date!==day) return;
    if(m.sid) used[m.sid]=1;
    var u=escHtml(m.unit||''), o={ts:m.ts,name:m.name};
    if(m.type==='in'){o.icon='📥';o.label='ገባ';o.main='+'+m.qty+' '+u;o.color='#15803D';}
    else if(m.type==='out'){
      var sale=m.sid?S.sales.find(function(x){return x.id===m.sid;}):null;
      o.icon='💰';o.label='ሽያጭ';o.main='−'+m.qty+' '+u;o.color='#1D4ED8';o.extra=sale?ETB(sale.total):'';
    }
    else if(m.type==='waste'){o.icon='🗑️';o.label='ብክነት';o.main='−'+m.qty+' '+u;o.color='#B91C1C';}
    else {o.icon='📋';o.label='የቆጠራ ማስተካከያ';o.main=(m.qty>0?'+':'')+m.qty+' '+u;o.color='#CA8A04';}
    E.push(o);
  });
  S.sales.forEach(function(x){
    if(x.date!==day||used[x.id]) return;
    E.push({ts:null,icon:'💰',label:'ሽያጭ',name:x.productName,main:'−'+x.qty,color:'#1D4ED8',extra:ETB(x.total)});
  });
  E.sort(function(a,b){
    if(a.ts&&b.ts) return b.ts-a.ts;
    if(a.ts) return -1;
    if(b.ts) return 1;
    return 0;
  });
  return E;
}
function rLog(){
  var day=S.logDate||today();
  var E=logEntries(day);
  var ds=S.sales.filter(function(x){return x.date===day;});
  var tot=ds.reduce(function(a,x){return a+(x.total||0);},0);
  var h=pgBack('🕒 የእንቅስቃሴ ዝርዝር');

    '<button class="btn g" id="log-next" style="padding:8px 14px"'+(day>=today()?' disabled':'')+'>▶</button></div>';
  h+='<div class="g2"><div class="card grn"><div class="sv g">'+ETB(Math.round(tot))+'</div><div class="sl">የሽያጭ ድምር</div></div>'+
     '<div class="card"><div class="sv">'+E.length+'</div><div class="sl">እንቅስቃሴዎች</div></div></div>';
  if(!E.length){
    h+='<div class="empty">'+(day===today()?'ዛሬ እስካሁን ምንም እንቅስቃሴ የለም':'በዚህ ቀን ምንም እንቅስቃሴ የለም')+'</div>';
  } else {
    h+='<div class="card">';
    E.forEach(function(e){
      h+='<div class="row" style="align-items:center;gap:10px">'+
        '<div style="font-size:20px">'+e.icon+'</div>'+
        '<div style="flex:1;min-width:0"><div class="rn" style="font-size:13px">'+escHtml(e.name||'')+'</div>'+

        '<div style="font-weight:800;font-size:14px;white-space:nowrap;color:'+e.color+'">'+e.main+'</div></div>';
    });
    h+='</div>';
  }
  h+='<div style="font-size:11px;color:#9CA3AF;text-align:center;margin-top:6px;line-height:1.6">ሰዓት ከታየ በፈጣን ገባ/ወጣ ምዝገባ የተመዘገበ ነው። ሰዓት የሌላቸው ሽያጮች በ"ሽያጭ" ገጽ በኩል የተመዘገቡ ናቸው።</div>';
  return h;
}

function shortStats(){
  var recs=S.counts.slice(-8), M={}, lastDiff={};
  recs.forEach(function(r){
    r.items.forEach(function(i){
      if(i.diff<0){
        // ያልተስተካከለ ተመሳሳይ ልዩነት እንደገና አይቆጠርም
        if(!r.applied&&lastDiff[i.pid]===i.diff) return;
        var m=M[i.pid]||(M[i.pid]={pid:i.pid,name:i.name,unit:i.unit,n:0,qty:0,val:0,dates:[]});
        m.n++;m.qty=round3(m.qty+(-i.diff));m.val+=isStaff()?0:(-i.diff)*(i.cost||0);m.dates.push(r.date);m.name=i.name;
      }
      lastDiff[i.pid]=r.applied?undefined:i.diff;
    });
    if(r.applied) r.items.forEach(function(i){lastDiff[i.pid]=undefined;});
  });
  var list=Object.keys(M).map(function(k){return M[k];}).filter(function(m){return m.n>=2;}).sort(function(a,b){return b.val-a.val||b.n-a.n;});
  return {recs:recs.length,map:M,list:list};
}

function D(){
  const p=S.products,s=S.sales;
  const inv=p.reduce((a,x)=>a+x.quantity*x.buyPrice,0);
  const rev=s.reduce((a,x)=>a+x.total,0);
  const prof=s.reduce((a,x)=>{const pr=p.find(r=>r.id===x.productId);return a+(pr?(x.price-pr.buyPrice)*x.qty:0);},0);
  const low=p.filter(x=>x.quantity<=(S.lowThreshold||10));
  const expAlert=p.filter(x=>{const es=expStatus(x.expDate);return es&&(es.status==='expired'||es.status==='soon');});
  return{inv,rev,prof,low,expAlert};
}

// ── Perf: debounce helper (batches rapid input events into one render) ────
function debounce(fn,ms){
  var t;
  return function(){
    var args=arguments,ctx=this;
    clearTimeout(t);
    t=setTimeout(function(){fn.apply(ctx,args);},ms);
  };
}
// ── Perf: preserve focus + caret across full innerHTML re-renders ─────────
// (every set()/render() rebuilds the whole page as a string; without this,
// typing in any input causes the cursor to jump to the end after each
// keystroke, which is what makes the app feel slow while typing)
function captureFocus(app){
  var el=document.activeElement;
  if(!el||!el.id||!app.contains(el)) return null;
  var info={id:el.id,type:el.type};
  try{
    if(typeof el.selectionStart==='number'){info.start=el.selectionStart;info.end=el.selectionEnd;}
  }catch(e){/* type=number/date/etc. don't support selection — leave start/end unset */}
  return info;
}
function restoreFocus(info){
  if(!info) return;
  var el=document.getElementById(info.id);
  if(!el) return;
  el.focus();
  if(typeof info.start==='number'){
    try{el.setSelectionRange(info.start,info.end);return;}catch(e){}
  }
  // number/date inputs: selection isn't directly settable, and a freshly
  // re-created element defaults the caret to position 0, not the end —
  // switch to text briefly to push the caret to the end, then switch back
  if(info.type==='number'||info.type==='date'){
    try{
      var len=(el.value||'').length,orig=el.type;
      el.type='text';
      el.setSelectionRange(len,len);
      el.type=orig;
    }catch(e){}
  }
}

function statBox(key,cls,icon,valCls,valHtml,label){
  var open=!!(S.dReveal&&S.dReveal[key]);
  return '<div class="card '+cls+'" data-reveal="'+key+'" style="cursor:pointer;user-select:none"><div style="font-size:20px;margin-bottom:5px">'+icon+'</div>'+
    (open?'<div class="sv '+valCls+'">'+valHtml+'</div>':'<div class="sv" style="color:#9CA3AF;letter-spacing:4px">••••</div>')+
    '<div class="sl">'+label+(open?'':' · ንካ ለማሳየት')+'</div></div>';
}
function rDash(d){
  var html=rSecNotice()+rTodayBanner()+rCountCard()+rRepBtn();
  // Exp alert
  if(d.expAlert.length>0){
    html+='<div class="exp-banner"><div class="etitle">⚠️ ጊዜ እያለቀ ያሉ ዕቃዎች ('+d.expAlert.length+')</div>';
    d.expAlert.forEach(function(p){
      var es=expStatus(p.expDate);
      html+='<div class="exp-row"><span>'+p.name+'</span><span class="badge '+(es.status==='expired'?'exp':'soon')+'">'+es.label+'</span></div>';
    });
    html+='</div>';
  }
  // low stock section — respects hide toggle
  if(S.hideLowStock){
    html+='<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px">';
    html+='<span style="font-size:12px;color:#6B7280">🔕 ዝቅተኛ ክምችት ማሳወቂያ ተሰውሯል</span>';
    html+='<button class="btn g" id="unhide-low-btn" style="font-size:11px;padding:5px 10px">አሳይ</button>';
    html+='</div>';
  } else {
  var thresh=S.lowThreshold||10;
  html+='<div class="card warn" style="border-color:'+(d.low.length>0?'#FCA5A5':'#BBF7D0')+';background:'+(d.low.length>0?'#FFF5F5':'#F0FDF4')+'">';

  html+='<div class="st" style="color:'+(d.low.length>0?'#EF4444':'#16A34A')+'">'+(d.low.length>0?'⚠️ ዝቅተኛ ክምችት ('+d.low.length+')':'✅ ክምችት ጥሩ ነው')+'</div>';

  html+='<button class="btn '+(d.low.length>0?'d':'p')+'" id="check-low-btn" style="font-size:11px;padding:5px 10px">🔔 ማሳወቂያ</button>';
  html+='<button class="btn g" id="hide-low-btn" title="ደብቅ" style="font-size:11px;padding:5px 8px">✕</button>';
  html+='</div>';
  html+='</div>';
  // threshold setter
  html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:'+(d.low.length>0?'10':'0')+'px;flex-wrap:wrap">';
  html+='<span style="font-size:11px;color:#6B7280">የማስጠንቀቂያ ቁጥር:</span>';
  [5,10,20,50].forEach(function(n){
    html+='<button class="btn '+(thresh===n?'p':'g')+'" data-thresh="'+n+'" style="font-size:11px;padding:4px 10px">'+n+'</button>';
  });
  html+='</div>';
  if(d.low.length>0){
    d.low.forEach(function(p){
      var pct=Math.min(100,Math.round((p.quantity/thresh)*100));

      html+='<div style="display:flex;justify-content:space-between;margin-bottom:3px">';

      html+='</div>';
    });
  }
  html+='</div>';
  }
  // manual backup button
  html+='<button id="manual-backup-btn" style="width:100%;background:linear-gradient(135deg,#0088cc,#0066aa);color:#fff;border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit">📲 Telegram Backup ላክ</button>';
  html+='<div class="card"><div class="st">🕒 የቅርብ ሽያጮች</div>';
  if(S.sales.length===0) html+='<div class="empty">ሽያጭ ገና አልተመዘገበም</div>';
  else S.sales.slice(-5).reverse().forEach(function(s){
    html+='<div class="row"><div><div class="rn">'+s.productName+'</div><div class="rs">'+s.date+' · '+s.qty+' ቁ</div></div><div class="rv">'+ETB(s.total)+'</div></div>';
  });
  html+='</div>';
  // ── Import/Export bar ──
  html+='<div style="margin-top:16px;background:#F0FDF4;border:1.5px solid #BBF7D0;border-radius:14px;padding:14px 16px">';
  html+='<div style="font-weight:800;font-size:13px;color:#15803D;margin-bottom:10px">📂 Backup & Import</div>';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  html+='<label style="flex:1;min-width:120px;background:#16A34A;color:#fff;border-radius:10px;padding:10px 12px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">'+
    '📥 JSON ፋይል ጫን'+
    '<input type="file" id="import-file-input" accept=".json,application/json" style="display:none"/>'+
    '</label>';
  html+='</div>';
  html+='<div style="font-size:10px;color:#6B7280;margin-top:8px">💡 Telegram bot ከላከው grb_backup_...json ፋይል ቀጥታ ይጫናሉ</div>';
  html+='</div>';
  return html;
}

function rInv(){
  if(!S.selCat) return rCatGrid();

  // ── "ሁሉም እቃ" virtual view ──
  if(S.selCat==='__all__'){
    var allProds=S.products;
    var allFiltered=allProds.filter(function(p){
      var q=S.pSearch.toLowerCase();
      return !q||p.name.toLowerCase().includes(q)||(getCat(p.category).name||'').includes(q);
    });
    // optional: filter by cat
    var catFilter=S.allCatFilter||'';
    if(catFilter) allFiltered=allFiltered.filter(function(p){return p.category===catFilter;});
    var html='<div class="fr">'+
      '<button class="back-btn" id="back-cat">← ተመለስ</button>'+

      '</div>';
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;background:linear-gradient(135deg,#DCFCE7,#F0FDF4);border:1.5px solid #16A34A44;border-radius:12px;padding:10px 14px;">';
    html+='<span style="font-size:26px">🌿</span><div><div style="font-weight:800;font-size:14px;color:#15803D">ሁሉም እቃ</div><div style="font-size:11px;color:#6B7280">'+allProds.length+' ዕቃ</div></div></div>';
    // search + cat filter bar
    html+='<input class="inp" id="ps" placeholder="ዕቃ ፈልግ..." value="'+S.pSearch+'" style="margin-bottom:8px"/>';
    html+='<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px">';
    html+='<button class="btn '+(catFilter===''?'p':'g')+'" data-allcat="" style="white-space:nowrap;font-size:11px;padding:5px 10px">ሁሉም</button>';
    getCats().forEach(function(ct){
      var hasProd=S.products.some(function(p){return p.category===ct.id;});
      if(!hasProd) return;
      html+='<button class="btn '+(catFilter===ct.id?'p':'g')+'" data-allcat="'+ct.id+'" style="white-space:nowrap;font-size:11px;padding:5px 10px">'+ct.icon+' '+ct.name+'</button>';
    });
    html+='</div>';
    // sort bar for all view
    html+='<div style="display:flex;gap:6px;margin-bottom:8px">';
    var sorts2=[{k:'az',l:'🔤 A-Z'},{k:'za',l:'🔤 Z-A'},{k:'qty',l:'📦 ክምችት'},{k:'price',l:'💰 ዋጋ'}];
    sorts2.forEach(function(s){html+='<button class="btn '+(S.pSort===s.k?'p':'g')+'" data-psort="'+s.k+'" style="font-size:11px;padding:5px 9px;white-space:nowrap">'+s.l+'</button>';});
    html+='</div>';
    var allSorted=allFiltered.slice().sort(function(a,b){
      if(S.pSort==='az') return a.name.localeCompare(b.name);
      if(S.pSort==='za') return b.name.localeCompare(a.name);
      if(S.pSort==='qty') return b.quantity-a.quantity;
      if(S.pSort==='price') return b.sellPrice-a.sellPrice;
      return 0;
    });
    if(allSorted.length===0){html+='<div class="empty">ዕቃ አልተገኘም</div>';}
    else{
      html+='<div class="prod-grid">';
      allSorted.forEach(function(p){
        var cat=getCat(p.category);
        var es=expStatus(p.expDate);
        var cls='pg-card'+(es&&es.status==='expired'?' expired':es&&es.status==='soon'?' exp-soon':'');
        html+='<div class="'+cls+'" data-detail="'+p.id+'" style="cursor:pointer">';

        html+='<div class="pg-name">'+p.name+'</div>';
        html+='<div class="pg-price">'+ETB(p.sellPrice)+'</div>';
        html+='<div class="pg-unit">/ '+p.unit+'</div>';
        if(es) html+='<div class="pg-exp '+es.status+'">📅 '+es.label+'</div>';
        else if(p.expDate) html+='<div class="pg-exp ok">📅 '+p.expDate+'</div>';
        var thr2=S.lowThreshold||10;
      html+='<div class="pg-qty'+(p.quantity<=thr2?' low':'')+'">ክምችት: '+p.quantity+'</div>';
      html+=quickBtns(p);
        html+='</div>';
      });
      html+='</div>';
    }
    return html;
  }

  var cat=getCat(S.selCat);
  var catProds=S.products.filter(function(p){return p.category===S.selCat;});
  var filtered=catProds.filter(function(p){return p.name.includes(S.pSearch);});
  var html='<div class="fr">'+
    '<button class="back-btn" id="back-cat">← ተመለስ</button>'+
    '<button class="btn p" id="ap-btn" style="font-size:12px;padding:8px 12px">+ አዲስ ዕቃ</button>'+
    '</div>';
  html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;background:'+cat.bg+';border:1.5px solid '+cat.color+'33;border-radius:12px;padding:10px 14px;">';
  html+='<span style="font-size:26px">'+cat.icon+'</span><div><div style="font-weight:800;font-size:14px;color:'+cat.color+'">'+cat.name+'</div><div style="font-size:11px;color:#6B7280">'+catProds.length+' ዕቃ</div></div></div>';
  html+='<input class="inp" id="ps" placeholder="ዕቃ ፈልግ..." value="'+S.pSearch+'" style="margin-bottom:8px"/>';
  // sort bar
  html+='<div style="display:flex;gap:6px;margin-bottom:10px">';
  var sorts=[{k:'az',l:'🔤 A-Z'},{k:'za',l:'🔤 Z-A'},{k:'qty',l:'📦 ክምችት'},{k:'price',l:'💰 ዋጋ'}];
  sorts.forEach(function(s){html+='<button class="btn '+(S.pSort===s.k?'p':'g')+'" data-psort="'+s.k+'" style="font-size:11px;padding:5px 9px;white-space:nowrap">'+s.l+'</button>';});
  html+='</div>';
  // sort filtered
  var sorted=filtered.slice().sort(function(a,b){
    if(S.pSort==='az') return a.name.localeCompare(b.name);
    if(S.pSort==='za') return b.name.localeCompare(a.name);
    if(S.pSort==='qty') return b.quantity-a.quantity;
    if(S.pSort==='price') return b.sellPrice-a.sellPrice;
    return 0;
  });
  if(sorted.length===0){html+='<div class="empty">ዕቃ አልተገኘም — + አዲስ ዕቃ ጨምር</div>';}
  else {
    html+='<div class="prod-grid">';
    sorted.forEach(function(p){
      var es=expStatus(p.expDate);
      var cls='pg-card'+(es&&es.status==='expired'?' expired':es&&es.status==='soon'?' exp-soon':'');
      html+='<div class="'+cls+'" data-detail="'+p.id+'" style="cursor:pointer">';
      if(p.photo) html+='<img src="'+p.photo+'" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;margin-bottom:6px"/>';
      html+='<div class="pg-badge">'+cat.icon+' '+cat.name+'</div>';
      html+='<div class="pg-name">'+p.name+'</div>';
      html+='<div class="pg-price">'+ETB(p.sellPrice)+'</div>';
      html+='<div class="pg-unit">/ '+p.unit+'</div>';
      if(es) html+='<div class="pg-exp '+es.status+'">📅 '+es.label+'</div>';
      else if(p.expDate) html+='<div class="pg-exp ok">📅 '+p.expDate+'</div>';
      var thr2=S.lowThreshold||10;
      html+='<div class="pg-qty'+(p.quantity<=thr2?' low':'')+'">ክምችት: '+p.quantity+'</div>';
      html+=quickBtns(p);
      html+='<div class="pg-actions">';
      html+='<button class="pg-btn e" data-edit="'+p.id+'">✏️</button>';
      html+='<button class="pg-btn d" data-del="'+p.id+'">🗑️</button>';
      html+='</div></div>';
    });
    html+='</div>';
  }
  return html;
}

    '<div style="display:flex;gap:6px">'+
    '<button class="btn '+(mm?'p':'g')+'" id="manage-cat-btn" style="font-size:12px;padding:7px 12px">'+(mm?'✅ ጨርስ':'⚙️ አስተዳድር')+'</button>'+
    (!mm?'<button class="btn p" id="add-cat-btn" style="font-size:12px;padding:7px 12px">➕ ጨምር</button>':'')+
    '</div></div>';
  if(!mm){
    html+='<div style="display:flex;gap:8px;margin-bottom:10px">';
    html+='<button class="btn g" id="inv-export-pdf-btn" style="flex:1;font-size:12px;padding:8px">📄 ዝርዝር PDF</button>';
    html+='<button class="btn g" id="inv-export-csv-btn" style="flex:1;font-size:12px;padding:8px">📊 ዝርዝር Excel</button>';

  if(mm){
    html+='<div class="cat-manage-bar">'+
      '<span style="font-size:13px;font-weight:700;color:#16A34A">✏️ ምድቦችን አስተዳድር</span>'+
      '<span class="cat-manage-hint">⬆️⬇️ ቦታ ቀያይር · 🗑️ ሰርዝ</span>'+
    '</div>';
  }
  // "ሁሉም እቃ" virtual card (always first, not in manage mode drag)

    html+='<span style="font-size:36px">🌿</span>';
    html+='<div style="flex:1"><div class="cat-name" style="color:#15803D;font-size:15px">ሁሉም እቃ</div>';
    html+='<div class="cat-count" style="margin-top:3px">'+allCnt+' ዕቃ'+(allExpCnt>0?' · <span class="badge exp">⚠️'+allExpCnt+'</span>':'')+'</div></div>';
    html+='<span style="font-size:20px;color:#16A34A">›</span>';
    html+='</div></div>';
  }
  html+='<div class="cat-grid" id="cat-grid-container">';
  getCats().forEach(function(cat,idx){
    var cnt=S.products.filter(function(p){return p.category===cat.id;}).length;
    var expCnt=S.products.filter(function(p){var es=expStatus(p.expDate);return p.category===cat.id&&es&&(es.status==='expired'||es.status==='soon');}).length;
    if(mm){
      html+='<div class="cat-card manage-mode" data-cat-idx="'+idx+'" draggable="true" style="border-color:'+cat.color+'44;background:'+cat.bg+';position:relative;padding-top:28px">';
      html+='<div style="position:absolute;top:6px;left:8px;font-size:18px;color:#9CA3AF">☰</div>';
      html+='<button class="cat-del-btn" data-del-cat="'+cat.id+'" title="ሰርዝ">✕</button>';
      html+='<div style="text-align:center;margin-bottom:4px"><span style="font-size:28px">'+cat.icon+'</span></div>';
      html+='<div class="cat-name" style="color:'+cat.color+';font-size:12px;text-align:center">'+cat.name+'</div>';
      html+='<div class="cat-count" style="text-align:center;margin-top:2px">'+cnt+' ዕቃ</div>';

      html+='<div style="display:flex;gap:4px;margin-top:8px">';
      if(idx>0) html+='<button class="btn g" style="flex:1;padding:4px;font-size:13px" data-move-cat="'+idx+'" data-move-dir="-1">⬆️</button>';
      if(idx<getCats().length-1) html+='<button class="btn g" style="flex:1;padding:4px;font-size:13px" data-move-cat="'+idx+'" data-move-dir="1">⬇️</button>';
      html+='</div>';
      html+='</div>';
    } else {
      html+='<div class="cat-card" data-cat="'+cat.id+'" style="border-color:'+cat.color+'44;background:'+cat.bg+'">';
      html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
      html+='<span style="font-size:32px">'+cat.icon+'</span>';
      if(expCnt>0) html+='<span class="badge exp">⚠️'+expCnt+'</span>';

function rSales(){
  var html='<div class="fr">'+
    '<div style="font-size:15px;font-weight:800">💰 ሽያጮች ('+S.sales.length+')</div>'+
    '<button class="btn p" id="as-btn" style="font-size:12px;padding:8px 12px">+ ሽያጭ</button>'+
    '</div>';
  html+='<button class="btn g" id="sales-toggle-btn" style="width:100%;margin-bottom:10px;font-size:13px">'+
    (S.salesListOpen?'🔼 ዝርዝሩን ዝጋ':'🔽 ዝርዝሩን ክፈት')+'</button>';
  if(!S.salesListOpen) return html;
  html+='<input class="inp" id="ss" placeholder="ሽያጭ ፈልግ..." value="'+S.sSearch+'" style="margin-bottom:10px"/>';
  var filtered=S.sales.filter(function(s){return s.productName.includes(S.sSearch)||s.date.includes(S.sSearch);});
  if(filtered.length===0){html+='<div class="empty">ሽያጭ አልተገኘም</div>';}
  else filtered.slice().reverse().forEach(function(s){
    var pr=S.products.find(function(p){return p.id===s.productId;});
    var prof=pr?(s.price-pr.buyPrice)*s.qty:0;
    html+='<div class="si">';
    html+='<div class="sh"><div><div class="sn">'+s.productName+'</div><div class="sm">'+s.date+' · '+s.qty+' '+(pr?pr.unit:'ቁ')+' × '+ETB(s.price)+'</div></div>';
    html+='<div style="text-align:right"><div class="st2">'+ETB(s.total)+'</div>'+(isStaff()?'':'<div class="sp">ትርፍ: '+ETB(prof)+'</div>')+'</div></div>';
    // Edit + Delete buttons for sale
    html+='<div class="sact">';
    html+='<button class="btn g" style="flex:1;font-size:12px;padding:6px" data-edit-sale="'+s.id+'">✏️ አስተካክል</button>';
    html+='<button class="btn d" style="flex:1;font-size:12px;padding:6px" data-del-sale="'+s.id+'">🗑️ ሰርዝ</button>';
    html+='</div></div>';
  });
  return html;
}

function rRepExtras(d){
  var h='';

function rReport(d){return rRepExtras(d)+rReportMain(d);}
function rReportMain(d){
  // ── per-day sales for last 7 days chart ──
  var days=[];
  for(var i=6;i>=0;i--){
    var dt=new Date(); dt.setDate(dt.getDate()-i);
    var ds=dt.toISOString().slice(0,10);
    var label=['እሑ','ሰኞ','ማ','ረቡ','ሐሙ','ዓር','ቅዳ'][dt.getDay()];
    var rev=S.sales.filter(function(s){return s.date===ds;}).reduce(function(a,s){return a+s.total;},0);
    days.push({label:label,date:ds,rev:rev});
  }
  var maxRev=Math.max.apply(null,days.map(function(x){return x.rev;}))||1;

  // ── per-cat revenue ──
  var catData=getCats().map(function(ct){
    var ps=S.products.filter(function(p){return p.category===ct.id;});
    var rev=S.sales.filter(function(s){return ps.find(function(p){return p.id===s.productId;});}).reduce(function(a,s){return a+s.total;},0);
    var cost=S.sales.filter(function(s){var pr=ps.find(function(p){return p.id===s.productId;});return !!pr;}).reduce(function(a,s){var pr=ps.find(function(p){return p.id===s.productId;});return a+(pr?(s.price-pr.buyPrice)*s.qty:0);},0);
    return{ct:ct,ps:ps,rev:rev,cost:cost};
  }).filter(function(x){return x.rev>0;});
  var maxCatRev=Math.max.apply(null,catData.map(function(x){return x.rev;}))||1;

  var html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
  html+='<div style="font-size:15px;font-weight:800">📊 ሪፖርት</div>';
  if(!isStaff()) html+='<button class="btn p" id="pdf-export-btn" style="font-size:12px;padding:7px 12px">📄 PDF Export</button>';
  html+='</div>';

  // ── 7-day bar chart ──
  html+='<div class="card" style="margin-bottom:10px">';
  html+='<div class="st" style="margin-bottom:12px">📈 የ7 ቀን ሽያጭ</div>';
  html+='<div style="display:flex;align-items:flex-end;gap:6px;height:120px;padding:0 4px">';
  days.forEach(function(day){
    var h=maxRev>0?Math.round((day.rev/maxRev)*80):0;
    var today2=new Date().toISOString().slice(0,10);
    var isToday=day.date===today2;
    html+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">';
    html+='<div style="font-size:9px;color:#6B7280">'+( day.rev>0?ETB(day.rev).replace('ብር',''):'')+'</div>';
    html+='<div style="width:100%;background:'+(isToday?'#16A34A':'#86EFAC')+';border-radius:4px 4px 0 0;height:'+h+'px;min-height:'+(day.rev>0?'4':'0')+'px;transition:height 0.3s"></div>';
    html+='<div style="font-size:10px;font-weight:'+(isToday?'800':'400')+';color:'+(isToday?'#15803D':'#6B7280')+'">'+day.label+'</div>';
    html+='</div>';
  });
  html+='</div></div>';

  // ── per-category bar chart ──
  if(catData.length>0){
    html+='<div class="card" style="margin-bottom:10px">';
    html+='<div class="st" style="margin-bottom:10px">📦 በምድብ ሽያጭ</div>';
    catData.forEach(function(x){
      var pct=Math.round((x.rev/maxCatRev)*100);
      html+='<div style="margin-bottom:10px">';
      html+='<div style="display:flex;justify-content:space-between;margin-bottom:3px">';
      html+='<span style="font-size:12px">'+x.ct.icon+' '+x.ct.name+'</span>';
      html+='<span style="font-size:12px;font-weight:700;color:#16A34A">'+ETB(x.rev)+'</span>';
      html+='</div>';
      html+='<div style="background:#E5E7EB;border-radius:6px;height:8px">';
      html+='<div style="background:'+x.ct.color+';border-radius:6px;height:8px;width:'+pct+'%;transition:width 0.4s"></div>';
      html+='</div>';
      html+='<div style="font-size:10px;color:#6B7280;margin-top:2px">'+x.ps.length+' ዕቃ'+(isStaff()?'':' · ትርፍ: '+ETB(x.cost))+'</div>';
      html+='</div>';
    });
    html+='</div>';
  }

  // ── top 5 products ──
  var topProds=S.sales.reduce(function(acc,s){
    acc[s.productId]=(acc[s.productId]||0)+s.total; return acc;
  },{});
  var top5=Object.keys(topProds).sort(function(a,b){return topProds[b]-topProds[a];}).slice(0,5).map(function(id){
    var p=S.products.find(function(x){return x.id===id;});
    return{name:p?p.name:id,rev:topProds[id]};
  });
  if(top5.length>0){
    html+='<div class="card" style="margin-bottom:10px">';
    html+='<div class="st" style="margin-bottom:8px">🏆 ምርጥ 5 ዕቃ</div>';
    top5.forEach(function(p,i){
      var medals=['🥇','🥈','🥉','4️⃣','5️⃣'];
      html+='<div class="rr"><span>'+medals[i]+' '+p.name+'</span><span style="color:#16A34A;font-weight:700">'+ETB(p.rev)+'</span></div>';
    });
    html+='</div>';
  }

  // ── expiry alerts ──
  if(d.expAlert.length>0){
    html+='<div class="exp-banner">';
    html+='<div class="etitle">⚠️ ጊዜ እያለቀ ያሉ ('+d.expAlert.length+')</div>';

    html+='</div>';
  }

  return html;
}

// ── Install prompt ───────────────────────────────────────────────────────
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredPrompt=e;
  showInstallBar();
});
window.addEventListener('appinstalled',function(){
  hideInstallBar();
  deferredPrompt=null;
  showToast('✅ አፑ ተጭኗል!');
});
function showInstallBar(){
  var bar=document.getElementById('install-bar');
  if(bar) bar.style.display='flex';
}
function hideInstallBar(){
  var bar=document.getElementById('install-bar');
  if(bar) bar.style.display='none';
}
function triggerInstall(){
  if(!deferredPrompt){
    showToast('📱 Browser ⋮ → "Add to Home Screen" ተጫን');
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(r){
    if(r.outcome==='accepted') showToast('✅ አፑ እየተጫነ ነው!');
    deferredPrompt=null;
    hideInstallBar();
  });
}

// ── PWA (offline support via external sw.js) ───────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    // Force check for a newer sw.js/app version right away
    reg.update();
    // If an update is found and installed, activate it and reload once so
    // the user is never stuck running old cached JS (which can look like
    // "features are broken" when they're actually just using an old build).
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange',function(){
        if(nw.state==='installed' && navigator.serviceWorker.controller){
          nw.postMessage&&nw.postMessage({type:'SKIP_WAITING'});
          window.location.reload();
        }
      });
    });
  }).catch(function(){});
  // periodically re-check for updates while the app stays open
  setInterval(function(){
    navigator.serviceWorker.getRegistration().then(function(reg){reg&&reg.update();});
  },10*60*1000);
}

    totalQty+=p.quantity;totalBuyVal+=buyVal;totalSellVal+=sellVal;
    return '<tr><td>'+escHtml(p.name)+'</td><td>'+cat.icon+' '+escHtml(cat.name)+'</td><td>'+p.quantity+' '+escHtml(p.unit||'')+'</td>'+(isStaff()?'<td>'+ETB(p.sellPrice)+'</td>':'<td>'+ETB(p.buyPrice)+'</td><td>'+ETB(p.sellPrice)+'</td><td>'+ETB(buyVal)+'</td>')+'</tr>';
  }).join('');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>የዕቃ ዝርዝር</title><style>'+

function exportInventoryCSV(){
  var sorted=exportList().sort(function(a,b){return a.name.localeCompare(b.name);});
  function esc(v){var s=String(v==null?'':v);if(/[",\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';return s;}
  var hdr=['የዕቃ ስም','ምድብ','ብዛት','መለኪያ','የግዥ ዋጋ','የሽያጭ ዋጋ','ጠቅላላ የግዥ ዋጋ','ጠቅላላ የሽያጭ ዋጋ','Exp Date'];
  var colsI=isStaff()?[0,1,2,3,5,8]:[0,1,2,3,4,5,6,7,8];
  var lines=[colsI.map(function(i){return hdr[i];}).map(esc).join(',')];
  sorted.forEach(function(p){
    var cat=getCat(p.category);
    var row=[p.name,cat.name,p.quantity,p.unit||'',p.buyPrice,p.sellPrice,p.quantity*p.buyPrice,p.quantity*p.sellPrice,p.expDate||''];
    lines.push(colsI.map(function(i){return row[i];}).map(esc).join(','));
  });
  var csv='\uFEFF'+lines.join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='የዕቃ_ዝርዝር_'+today()+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  showToast('✅ ዝርዝሩ ወርዷል!');
}
